apiVersion: v1
kind: Service
metadata:
  name: harold-app
  namespace: harold
spec:
  selector:
    app: harold-app
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harold-app
  namespace: harold
spec:
  replicas: 2
  selector:
    matchLabels:
      app: harold-app
  template:
    metadata:
      labels:
        app: harold-app
    spec:
      containers:
        - name: app
          image: ghcr.io/Prestwickuk/harold:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: harold-db-secret
                  key: DATABASE_URL
            - name: HAROLD_TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: harold-token-encryption
                  key: HAROLD_TOKEN_ENCRYPTION_KEY
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
