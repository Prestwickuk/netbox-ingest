name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: loft-sh/harold

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m unittest discover -s tests -v

  publish:
    name: Publish linux/amd64 image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publish the tested image to this repository's GHCR package
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Print published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "published digest $DIGEST"

  deploy:
    name: Hand the digest to loft-prod
    # `needs: publish` is the whole failed-publish guard: a publish that fails,
    # is cancelled, or is skipped never reaches this job, so no deployment PR
    # can describe an image that was not actually pushed.
    needs: publish
    # workflow_dispatch can run this workflow from any branch. Publishing a
    # sha-tagged image from a feature branch is harmless, but opening a
    # production deployment PR from one is not, so the handoff is limited to
    # the refs that represent a real release.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The PR itself is opened by loft-prod's `update-harold-version`
      # receiver, not from here. loft-prod owns which files pin the digest and
      # which tests assert it, so that knowledge stays in the repo being
      # edited, and no loft-prod write credential has to be readable here.
      - name: Dispatch the deployment PR
        uses: loft-sh/github-actions/.github/actions/repository-dispatch@repository-dispatch/v1 # zizmor: ignore[unpinned-uses]
        with:
          target-repo: loft-sh/loft-prod
          event-type: update-harold-version
          payload: |
            {
              "digest": "${{ needs.publish.outputs.digest }}",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref_name }}"
            }
        env:
          # GITHUB_TOKEN cannot dispatch into another repository. GH_ACCESS_TOKEN
          # is the org-wide PAT already used for cross-repo deployment PRs.
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
