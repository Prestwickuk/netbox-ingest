services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netbox_ingest
      POSTGRES_PASSWORD: netbox_ingest
      POSTGRES_DB: netbox_ingest
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbox_ingest"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://netbox_ingest:netbox_ingest@db:5432/netbox_ingest
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app  # live reload in dev

  worker:
    build: .
    command: python -m app.worker.runner
    environment:
      DATABASE_URL: postgresql://netbox_ingest:netbox_ingest@db:5432/netbox_ingest
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app

volumes:
  pgdata:
