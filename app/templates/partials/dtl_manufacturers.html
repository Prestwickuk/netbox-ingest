{% if error %}
<div class="bg-amber-50 border border-amber-200 text-amber-700 px-4 py-3 rounded-md text-sm">
  {{ error }}
  <button type="button" class="ml-2 underline"
    hx-get="/device-types/manufacturers" hx-target="#manufacturer-box" hx-swap="innerHTML">
    Retry
  </button>
</div>
{% else %}
<label class="block text-sm font-medium text-gray-700 mb-1">Manufacturer</label>
<select name="manufacturer"
  hx-get="/device-types/models" hx-target="#model-list" hx-swap="innerHTML" hx-trigger="change"
  class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
  <option value="">— Select a manufacturer ({{ manufacturers|length }} available) —</option>
  {% for m in manufacturers %}
  <option value="{{ m.name }}">{{ m.name }} ({{ m.count }})</option>
  {% endfor %}
</select>
{% endif %}
